    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --emerald-50: #ecfdf5;
            --emerald-100: #d1fae5;
            --emerald-200: #a7f3d0;
            --emerald-400: #34d399;
            --emerald-500: #10b981;
            --emerald-600: #059669;
            --emerald-700: #047857;
            --emerald-800: #065f46;
            --emerald-900: #064e3b;
            --gray-50: #fafafa;
            --gray-100: #f4f4f5;
            --gray-200: #e4e4e7;
            --gray-600: #52525b;
            --gray-700: #3f3f46;
            --gray-900: #18181b;
            --danger-500: #ef4444;
            --danger-600: #dc2626;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, var(--emerald-800) 0%, var(--emerald-900) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            position: relative;
            overflow: hidden;
        }
        
        body::before {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.3) 0%, transparent 70%);
            top: -200px;
            right: -200px;
            animation: float 6s ease-in-out infinite;
        }
        
        body::after {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.2) 0%, transparent 70%);
            bottom: -150px;
            left: -150px;
            animation: float 8s ease-in-out infinite reverse;
        }
        
        @keyframes float {
            0%, 100% {
                transform: translateY(0) scale(1);
            }
            50% {
                transform: translateY(-20px) scale(1.05);
            }
        }
        
        .login-container {
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            width: 100%;
            max-width: 480px;
            overflow: hidden;
            animation: slideUp 0.6s ease;
            position: relative;
            z-index: 1;
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .login-header {
            background: linear-gradient(135deg, var(--emerald-600) 0%, var(--emerald-700) 100%);
            padding: 3.5rem 2rem;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        
        .login-header::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.15) 0%, transparent 70%);
            animation: pulse 4s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                opacity: 0.5;
            }
            50% {
                transform: scale(1.2);
                opacity: 0.8;
            }
        }
        
        .logo {
            width: 90px;
            height: 90px;
            margin: 0 auto 1.5rem;
            position: relative;
            z-index: 1;
            animation: logo-pulse 2s ease-in-out infinite;
        }
        
        @keyframes logo-pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }
        
        .login-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: white;
            margin-bottom: 0.25rem;
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.3rem;
        }
        
        .login-subtitle {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.9);
            position: relative;
            z-index: 1;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
        
        .login-body {
            padding: 3rem 2.5rem;
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--gray-700);
            font-size: 0.95rem;
        }
        
        .input-wrapper {
            position: relative;
        }
        
        .input-icon {
            position: absolute;
            left: 1.25rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gray-600);
            width: 20px;
            height: 20px;
        }
        
        .form-input {
            width: 100%;
            padding: 1rem 1.25rem 1rem 3.5rem;
            border: 2px solid var(--gray-200);
            border-radius: 12px;
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
        }
        
        .form-input:focus {
            outline: none;
            border-color: var(--emerald-600);
            box-shadow: 0 0 0 4px rgba(5, 150, 105, 0.1);
        }
        
        .password-toggle {
            position: absolute;
            right: 1.25rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: var(--gray-600);
            padding: 0.5rem;
        }
        
        .password-toggle:hover {
            color: var(--emerald-600);
        }
        
        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }
        
        .remember-me {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
        }
        
        .remember-me input {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        
        .remember-me label {
            font-size: 0.9rem;
            color: var(--gray-700);
            cursor: pointer;
        }
        
        .forgot-password {
            font-size: 0.9rem;
            color: var(--emerald-600);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }
        
        .forgot-password:hover {
            color: var(--emerald-700);
            text-decoration: underline;
        }
        
        .btn-login {
            width: 100%;
            padding: 1.125rem 1.5rem;
            background: linear-gradient(135deg, var(--emerald-600), var(--emerald-700));
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1.05rem;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 15px rgba(5, 150, 105, 0.3);
        }
        
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(5, 150, 105, 0.4);
        }
        
        .btn-login:active {
            transform: translateY(0);
        }
        
        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .error-message {
            background: #fee2e2;
            color: #dc2626;
            padding: 1rem 1.25rem;
            border-radius: 10px;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
            display: none;
            align-items: center;
            gap: 0.75rem;
        }
        
        .error-message.show {
            display: flex;
        }
        
        .security-info {
            background: var(--gray-50);
            padding: 1rem;
            border-radius: 10px;
            margin-top: 1.5rem;
            font-size: 0.85rem;
            color: var(--gray-600);
            display: flex;
            align-items: flex-start;
            gap: 0.75rem;
        }
        
        .security-icon {
            color: var(--emerald-600);
            flex-shrink: 0;
        }
        
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        @media (max-width: 480px) {
            .login-container {
                border-radius: 0;
            }
            
            .login-header {
                padding: 2.5rem 1.5rem;
            }
            
            .login-body {
                padding: 2rem 1.5rem;
            }
        }
    
        /* Interactive Elements */
        .animate-on-scroll {
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.6s ease-out;
        }
        .animate-on-scroll.visible {
            opacity: 1;
            transform: translateY(0);
        }

    </style>
</head>
<body>

    <script>
        // ========================================
        // ADMIN CREDENTIALS CONFIGURATION
        // ========================================
        // IMPORTANT: Change these credentials before deploying to production!
        // For production, implement proper backend authentication
        
        const ADMIN_USERS = [
            {
                username: 'admin',
                password: 'admin123',  // ⚠️ CHANGE THIS IMMEDIATELY!
                role: 'Super Administrator',
                email: 'admin@middleeaststructural.com'
            },
            // Add more admin users here:
            // {
            //     username: 'editor',
            //     password: 'editor123',
            //     role: 'Editor',
            //     email: 'editor@middleeaststructural.com'
            // }
        ];

        // Security Configuration
        const MAX_LOGIN_ATTEMPTS = 5;
        const LOCKOUT_DURATION = 15 * 60 * 1000; // 15 minutes
        const SESSION_DURATION = 24 * 60 * 60 * 1000; // 24 hours

        // ========================================
        // LOGIN ATTEMPT TRACKING
        // ========================================
        function getLoginAttempts() {
            const attempts = localStorage.getItem('loginAttempts');
            return attempts ? JSON.parse(attempts) : { count: 0, lastAttempt: null };
        }

        function saveLoginAttempts(attempts) {
            localStorage.setItem('loginAttempts', JSON.stringify(attempts));
        }

        function checkLockout() {
            const attempts = getLoginAttempts();
            if (attempts.count >= MAX_LOGIN_ATTEMPTS && attempts.lastAttempt) {
                const timeSinceLastAttempt = Date.now() - new Date(attempts.lastAttempt).getTime();
                if (timeSinceLastAttempt < LOCKOUT_DURATION) {
                    const remainingMinutes = Math.ceil((LOCKOUT_DURATION - timeSinceLastAttempt) / 60000);
                    return {
                        locked: true,
                        remainingMinutes: remainingMinutes
                    };
                } else {
                    // Reset attempts after lockout period
                    saveLoginAttempts({ count: 0, lastAttempt: null });
                    return { locked: false };
                }
            }
            return { locked: false };
        }

        function incrementLoginAttempts() {
            const attempts = getLoginAttempts();
            attempts.count++;
            attempts.lastAttempt = new Date().toISOString();
            saveLoginAttempts(attempts);
            return attempts.count;
        }

        function resetLoginAttempts() {
            saveLoginAttempts({ count: 0, lastAttempt: null });
        }

        // ========================================
        // SESSION MANAGEMENT
        // ========================================
        function createSession(user, remember) {
            const session = {
                username: user.username,
                email: user.email,
                role: user.role,
                loginTime: new Date().toISOString(),
                sessionId: generateSessionId(),
                expiresAt: new Date(Date.now() + SESSION_DURATION).toISOString()
            };
            
            if (remember) {
                localStorage.setItem('adminSession', JSON.stringify(session));
            } else {
                sessionStorage.setItem('adminSession', JSON.stringify(session));
            }
            
            // Log login activity
            logLoginActivity(user.username, 'success');
            
            return session;
        }

        function generateSessionId() {
            return 'session_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
        }

        function logLoginActivity(username, status) {
            const loginHistory = JSON.parse(localStorage.getItem('loginHistory') || '[]');
            loginHistory.unshift({
                username: username,
                status: status,
                timestamp: new Date().toISOString(),
                userAgent: navigator.userAgent
            });
            // Keep only last 50 login attempts
            loginHistory.splice(50);
            localStorage.setItem('loginHistory', JSON.stringify(loginHistory));
        }

        // ========================================
        // AUTHENTICATION
        // ========================================
        function authenticateUser(username, password) {
            // Check if there are updated credentials in localStorage
            const storedCredentials = localStorage.getItem('adminCredentials');
            
            if (storedCredentials) {
                // Use updated credentials from localStorage
                const credentials = JSON.parse(storedCredentials);
                if (username === credentials.username && password === credentials.password) {
                    return {
                        username: credentials.username,
                        password: credentials.password,
                        role: 'Super Administrator',
                        email: 'admin@middleeaststructural.com'
                    };
                }
            }
            
            // Fall back to default ADMIN_USERS
            return ADMIN_USERS.find(user => 
                user.username === username && user.password === password
            );
        }

        // ========================================
        // FORM HANDLING
        // ========================================
        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            login();
        });

        function login() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const remember = document.getElementById('remember').checked;
            const loginBtn = document.getElementById('login-btn');
            const loginText = document.getElementById('login-text');
            
            // Clear previous errors
            hideError();
            
            // Validate input
            if (!username || !password) {
                showError('Please enter both username and password');
                return;
            }

            // Check if account is locked
            const lockoutStatus = checkLockout();
            if (lockoutStatus.locked) {
                showError(`Too many failed attempts. Please try again in ${lockoutStatus.remainingMinutes} minutes.`);
                return;
            }
            
            // Show loading state
            loginBtn.disabled = true;
            loginText.innerHTML = '<div class="loading"></div>';
            
            // Simulate API call delay (remove in production)
            setTimeout(() => {
                // Authenticate user
                const user = authenticateUser(username, password);
                
                if (user) {
                    // Successful login
                    resetLoginAttempts();
                    createSession(user, remember);
                    
                    // Show success message briefly
                    loginText.textContent = 'Success! Redirecting...';
                    
                    // Redirect to dashboard
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 500);
                } else {
                    // Failed login
                    const attempts = incrementLoginAttempts();
                    const remainingAttempts = MAX_LOGIN_ATTEMPTS - attempts;
                    
                    logLoginActivity(username, 'failed');
                    
                    if (remainingAttempts > 0) {
                        showError(`Invalid username or password. ${remainingAttempts} attempts remaining.`);
                    } else {
                        showError(`Too many failed attempts. Account locked for ${LOCKOUT_DURATION / 60000} minutes.`);
                    }
                    
                    loginBtn.disabled = false;
                    loginText.textContent = 'Sign In';
                }
            }, 1000);
        }

        // ========================================
        // PASSWORD VISIBILITY TOGGLE
        // ========================================
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eye-icon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.innerHTML = `
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>
                `;
            } else {
                passwordInput.type = 'password';
                eyeIcon.innerHTML = `
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                `;
            }
        }

        // ========================================
        // ERROR HANDLING
        // ========================================
        function showError(message) {
            const errorDiv = document.getElementById('error-message');
            const errorText = document.getElementById('error-text');
            errorText.textContent = message;
            errorDiv.classList.add('show');
            
            // Auto-hide after 5 seconds
            setTimeout(() => {
                hideError();
            }, 5000);
        }

        function hideError() {
            document.getElementById('error-message').classList.remove('show');
        }

        // ========================================
        // SESSION VALIDATION
        // ========================================
        function checkExistingSession() {
            const session = localStorage.getItem('adminSession') || sessionStorage.getItem('adminSession');
            
            if (session) {
                try {
                    const sessionData = JSON.parse(session);
                    const expiresAt = new Date(sessionData.expiresAt);
                    const now = new Date();
                    
                    // Check if session is still valid
                    if (now < expiresAt) {
                        // Session is valid, redirect to dashboard
                        window.location.href = 'dashboard.html';
                    } else {
                        // Session expired, clear it
                        localStorage.removeItem('adminSession');
                        sessionStorage.removeItem('adminSession');
                    }
                } catch (error) {
                    // Invalid session data, clear it
                    localStorage.removeItem('adminSession');
                    sessionStorage.removeItem('adminSession');
                }
            }
        }

        // ========================================
        // KEYBOARD SHORTCUTS
        // ========================================
        document.getElementById('username').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                document.getElementById('password').focus();
            }
        });

        document.getElementById('password').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                login();
            }
        });

        // ========================================
        // INITIALIZATION
        // ========================================
        window.addEventListener('load', function() {
            // Check for existing valid session
            checkExistingSession();
            
            // Focus username field
            document.getElementById('username').focus();
            
            // Check lockout status on load
            const lockoutStatus = checkLockout();
            if (lockoutStatus.locked) {
                showError(`Account temporarily locked. Please try again in ${lockoutStatus.remainingMinutes} minutes.`);
                document.getElementById('login-btn').disabled = true;
            }
        });

        // ========================================
        // SECURITY ENHANCEMENTS
        // ========================================
        
        // Prevent multiple rapid submissions
        let isSubmitting = false;
        document.getElementById('login-form').addEventListener('submit', function(e) {
            if (isSubmitting) {
                e.preventDefault();
                return false;
            }
            isSubmitting = true;
            setTimeout(() => { isSubmitting = false; }, 2000);
        });

        // Clear password on page unload for security
        window.addEventListener('beforeunload', function() {
            document.getElementById('password').value = '';
        });

        // Disable autocomplete for password in some browsers
        document.getElementById('password').setAttribute('autocomplete', 'current-password');
    </script>

    <script>
        // Scroll Animation Observer
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                }
            });
        }, { threshold: 0.1 });
        
        document.querySelectorAll('.animate-on-scroll').forEach(el => {
            observer.observe(el);
        });
    </script>

</body>
</html>
